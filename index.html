<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>우리집 보드</title>
<style>
:root{
  --bg:#fff4e6;--card:#ffffff;--ink:#3b2f27;--sub:#8c7b6c;--line:#f1e3d0;--soft:#fff8ef;
  --accent:#ff8a5c;--shadow:0 .6vmin 2vmin rgba(130,85,40,.10);--r:clamp(14px,2.2vmin,26px);
  --fs:clamp(14px,1.9vmin,22px);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
body.night{--bg:#121722;--card:#1b2230;--ink:#e8edf6;--sub:#8e9ab0;--line:#283146;--soft:#222a3a;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:var(--fs);transition:background .6s,color .6s}
button{font:inherit;color:inherit}
.j{font-family:'Jua','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-weight:400}
#app{position:fixed;inset:0;display:flex;flex-direction:column;gap:1.5vmin;padding:calc(var(--sat) + 1.6vmin) calc(var(--sar) + 1.8vmin) calc(var(--sab) + 1.6vmin) calc(var(--sal) + 1.8vmin)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.7vmin 2vmin;min-width:0;min-height:0}
/* 머리줄 */
header{display:grid;grid-template-columns:1.15fr 1.6fr 1.5fr;gap:1.5vmin}
.hclock{display:flex;flex-direction:column;justify-content:center}
.htitle{font-size:1.05em;color:var(--accent)}
.htime{font-size:4.2em;line-height:1;letter-spacing:-.01em;margin-top:.15em}
.hdate{font-size:1.05em;color:var(--sub);margin-top:.25em}
.hwx{display:flex;align-items:center;gap:2vmin}
.wxi{font-size:4.4em;line-height:1}
.wxt{font-size:3.1em;line-height:1}
.wxd{color:var(--sub);line-height:1.55;font-size:.95em}
.wxd b{color:var(--ink);font-weight:700}
.pm{display:inline-block;border-radius:1em;padding:.05em .6em;font-weight:800;font-size:.9em;color:#fff}
.hside{display:flex;flex-direction:column;gap:1vmin}
.chips{display:flex;flex-wrap:wrap;gap:.8vmin;align-content:flex-start;flex:1}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:2em;padding:.3em .8em;font-weight:700;font-size:.95em;white-space:nowrap}
.chip.warn{background:#fff0e8;border-color:#ffc9ad;color:#d2541f}
body.night .chip.warn{background:#3a2a24;border-color:#6b3f2c;color:#ffb08a}
.tools{display:flex;gap:.8vmin;justify-content:flex-end}
.tools button{border:1px solid var(--line);background:var(--soft);border-radius:1em;padding:.35em .8em;font-size:.95em;cursor:pointer}
/* 본문 */
main{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr 1fr 1.15fr;gap:1.5vmin}
.col{display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;font-size:1.25em;margin:.1em 0 .5em}
.ch.s{font-size:1.05em;color:var(--sub);margin-top:.8em}
.add{border:none;background:var(--accent);color:#fff;border-radius:1em;padding:.1em .7em;font-size:.85em;cursor:pointer;font-family:inherit}
.scroll{overflow:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ev{display:flex;align-items:center;gap:.6em;padding:.55em .6em;border-radius:.8em;margin-bottom:.35em;background:var(--soft);cursor:pointer}
.ev .t{font-weight:800;min-width:3.2em;font-variant-numeric:tabular-nums}
.ev .who{font-weight:800;font-size:.8em;color:#fff;border-radius:1em;padding:.1em .6em;white-space:nowrap}
.ev .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.past{opacity:.42}
.ev.next{outline:2px solid var(--accent);background:transparent}
.ev.next .t::after{content:' 다음';color:var(--accent);font-size:.75em}
.ev.school{cursor:default}
.empty{color:var(--sub);font-size:.92em;line-height:1.6;padding:.4em .2em}
/* 아이 카드 */
.kid{display:flex;flex-direction:column;overflow:hidden;padding:0}
.kh{display:flex;align-items:center;gap:.5em;padding:1.4vmin 2vmin;color:#fff}
.ke{font-size:2.2em;line-height:1;background:#ffffff40;border-radius:50%;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center}
.kn{font-size:1.9em;line-height:1}
.kg{font-size:.85em;opacity:.9;margin-top:.2em}
.kb{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.2vmin 1.8vmin 1.6vmin;gap:1vmin}
.rt{display:flex;flex-direction:column;gap:.45em;overflow:auto;min-height:0;scrollbar-width:none}
.ri{display:flex;align-items:center;gap:.6em;border:2px solid var(--line);background:var(--card);border-radius:.9em;padding:.5em .7em;text-align:left;cursor:pointer;font-size:1.02em;transition:transform .1s}
.ri:active{transform:scale(.97)}
.ri .bx{flex:none;width:1.35em;height:1.35em;border-radius:.4em;border:2px solid #d9c7b2;display:flex;align-items:center;justify-content:center;font-size:.9em;color:#fff}
.ri.done{background:var(--soft)}
.ri.done .lb{text-decoration:line-through;color:var(--sub)}
.stars{background:var(--soft);border-radius:1em;padding:.7em .8em}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-size:1.3em}
.sl small{font-size:.65em;color:var(--sub);font-family:'Noto Sans KR',sans-serif}
.bar{height:.75em;background:var(--line);border-radius:1em;overflow:hidden;margin:.45em 0}
.bar i{display:block;height:100%;border-radius:1em;transition:width .5s}
.rw{font-size:.88em;color:var(--sub);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4em}
.rw .sbtn{margin-left:auto}
.rw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{display:flex;gap:.4em}
.sbtn button{border:1px solid var(--line);background:var(--card);border-radius:1em;padding:.15em .6em;cursor:pointer;font-size:.95em}
.goal{border:none!important;color:#fff;font-weight:800;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.sup{font-size:.92em;border:2px dashed var(--line);border-radius:.9em;padding:.5em .7em;cursor:pointer;line-height:1.45}
.sup b{display:block;font-size:.85em;color:var(--sub)}
/* 오른쪽 */
.meal{background:var(--soft);border-radius:1em;padding:.6em .8em;line-height:1.6;font-size:.98em}
.meal .ms{font-size:.8em;color:var(--sub);margin-bottom:.2em}
.meal + .meal{margin-top:.5em}
.dd{display:flex;align-items:center;gap:.6em;padding:.35em .2em;border-bottom:1px dashed var(--line)}
.dd:last-child{border-bottom:none}
.dd .n{font-family:'Jua',sans-serif;min-width:3.6em;text-align:center;border-radius:1em;padding:.05em .5em;background:var(--accent);color:#fff;font-size:.95em}
.dd .n.far{background:#c9b8a6}
.dd .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .w{font-size:.8em;color:var(--sub)}
.memos{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.memo{border-radius:.6em;padding:.6em .7em;font-size:.92em;line-height:1.45;color:#3b2f27;cursor:pointer;min-height:3.4em;white-space:pre-wrap;word-break:break-all;box-shadow:0 2px 6px rgba(0,0,0,.06);transform:rotate(-.6deg)}
.memo:nth-child(even){transform:rotate(.7deg)}
/* 팝업 */
.sheet{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet.on{display:flex}
.box{background:var(--card);color:var(--ink);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:16px}
.box h2{margin:0 0 12px;font-family:'Jua',sans-serif;font-weight:400;font-size:24px}
.box h3{margin:18px 0 8px;font-size:15px;color:var(--accent)}
.box label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.box input[type=text],.box input[type=number],.box input[type=time],.box input[type=date],.box textarea,.box select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box textarea{min-height:90px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:2px solid var(--line);background:var(--soft);border-radius:2em;padding:6px 12px;cursor:pointer;font-weight:700}
.pills button.on{color:#fff;border-color:transparent}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;border:none;border-radius:14px;padding:13px;font-weight:800;cursor:pointer;background:var(--soft);font-size:16px}
.btns .pri{background:var(--accent);color:#fff}
.btns .del{background:#ffe3e0;color:#d63a2f;flex:.6}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.hint{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:6px}
.res button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.res small{color:var(--sub)}
.kidset{border:1px solid var(--line);border-radius:16px;padding:4px 14px 14px;margin-top:10px}
.pin{display:flex;justify-content:center;gap:14px;margin:8px 0 14px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.pin i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:none;background:var(--soft);border-radius:14px;padding:14px;font-size:22px;font-weight:800;cursor:pointer}
.big{font-size:56px;text-align:center;margin:4px 0}
.center{text-align:center}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);background:#3b2f27;color:#fff;border-radius:2em;padding:10px 20px;font-weight:700;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none;font-size:16px;white-space:nowrap}
#toast.on{opacity:1}
.boom{position:fixed;z-index:70;pointer-events:none;font-size:34px;animation:boom 1.3s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
/* 세로 화면 · 폰 */
@media (orientation:portrait), (max-width:900px){
  #app{position:static;min-height:100%;overflow:visible}
  html,body{height:auto;overflow:auto}
  header{grid-template-columns:1fr 1fr}
  .hside{grid-column:1/-1}
  main{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,auto)}
  #cSched,#cRight{grid-column:1/-1}
  .col,.kid{overflow:visible}
  :root{--fs:clamp(14px,2.3vmin,20px)}
}
@media (max-width:560px){
  header{grid-template-columns:1fr}
  main{grid-template-columns:1fr}
  .htime{font-size:3.6em}
  :root{--fs:15px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="card hclock">
      <div class="htitle j" id="hTitle">우리집</div>
      <div class="htime j" id="hTime">--:--</div>
      <div class="hdate" id="hDate"></div>
    </div>
    <div class="card hwx" id="hWx"><div class="wxi">⛅</div><div class="wxd">날씨 불러오는 중…</div></div>
    <div class="card hside">
      <div class="chips" id="hChips"></div>
      <div class="tools"><button id="tFull">⛶ 전체화면</button><button id="tSet">⚙ 설정</button></div>
    </div>
  </header>
  <main>
    <section class="card col" id="cSched">
      <div class="ch j"><span>📅 오늘 일정</span><button class="add" id="addEv">＋ 일정</button></div>
      <div class="scroll" style="flex:1">
        <div id="evToday"></div>
        <div class="ch s j">내일</div>
        <div id="evTmr"></div>
      </div>
    </section>
    <section class="card kid" data-i="0"></section>
    <section class="card kid" data-i="1"></section>
    <section class="card col" id="cRight">
      <div class="scroll" style="flex:1">
        <div class="ch j"><span id="mealTitle">🍱 오늘 급식</span></div>
        <div id="meal"></div>
        <div class="ch j" style="margin-top:.7em"><span>🏫 학교 일정 · D-day</span></div>
        <div id="dday"></div>
        <div class="ch j" style="margin-top:.7em"><span>📝 가족 메모</span><button class="add" id="addMemo">＋</button></div>
        <div class="memos" id="memos"></div>
      </div>
    </section>
  </main>
</div>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   우리집 보드 — 가족 대시보드 (한 기기에 저장되는 방식)
   ========================================================= */
const COLORS = {dad:'#4d96ff', mom:'#ff6b9a', all:'#9b7bff'};
const KID_COLORS = ['#ff9f1c','#2ec4b6','#ff6f91','#7b8cff','#5cb85c','#e0a800'];
const KID_EMOJI = ['👧','🧒','👦','🐰','🐱','🦄','🌸','⭐','🐶','🐻'];
const DEF_ROUTINE = ['🪥 양치하기','✏️ 숙제하기','📖 책 읽기 20분','🎒 알림장·가방 챙기기','🧸 장난감 정리'];
const DEF_SET = {
  title:'우리집', msg:'', dad:'아빠', mom:'엄마',
  kids:[
    {id:'k1', name:'첫째', emoji:'👧', color:KID_COLORS[0], grade:'', cls:'', school:null, routine:DEF_ROUTINE.slice(), goal:20, reward:'원하는 놀이 하기 🎠'},
    {id:'k2', name:'둘째', emoji:'👧', color:KID_COLORS[1], grade:'', cls:'', school:null, routine:DEF_ROUTINE.slice(), goal:20, reward:'원하는 놀이 하기 🎠'}
  ],
  place:{name:'서울', lat:37.5665, lon:126.978, auto:1},
  pin:'0000', night:1, wake:1, ddays:[]
};
const DEF_DATA = {events:[], memos:[], stars:{k1:0,k2:0}, checks:{}, bonus:{}, supplies:{k1:'',k2:''}};
const CITIES = [['서울',37.5665,126.978],['인천',37.4563,126.7052],['인천 서해구',37.5400,126.6600],['인천 검단구',37.5960,126.6600],['인천 서구',37.5452,126.676],['인천 연수구',37.4101,126.6783],['인천 영종구',37.4920,126.4940],['인천 제물포구',37.4730,126.6210],['부평',37.5070,126.7219],['김포',37.6153,126.7156],['부천',37.5034,126.766],['고양',37.6584,126.832],['파주',37.76,126.78],['수원',37.2636,127.0286],['성남',37.42,127.1267],['용인',37.2411,127.1776],['화성',37.1995,126.8315],['안양',37.3943,126.9568],['광명',37.4786,126.8644],['시흥',37.38,126.803],['안산',37.3219,126.8309],['하남',37.5393,127.2148],['남양주',37.636,127.2165],['의정부',37.7381,127.0337],['평택',36.9921,127.1129],['춘천',37.8813,127.7298],['원주',37.3422,127.9202],['강릉',37.7519,128.8761],['청주',36.6424,127.489],['천안',36.8151,127.1139],['세종',36.48,127.289],['대전',36.3504,127.3845],['전주',35.8242,127.148],['광주',35.1595,126.8526],['목포',34.8118,126.3922],['여수',34.7604,127.6622],['순천',34.9507,127.4872],['대구',35.8714,128.6014],['구미',36.1195,128.3446],['포항',36.019,129.3435],['울산',35.5384,129.3114],['부산',35.1796,129.0756],['창원',35.2281,128.6811],['김해',35.2285,128.8894],['통영',34.8544,128.4332],['제주',33.4996,126.5312],['서귀포',33.2541,126.56]];
const DOW = ['일','월','화','수','목','금','토'];

const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const clone = o => JSON.parse(JSON.stringify(o));
let S = Object.assign(clone(DEF_SET), LS.get('fb_set', {}));
let D = Object.assign(clone(DEF_DATA), LS.get('fb_data', {}));
let W = LS.get('fb_wx', null);        // 날씨 캐시
let M = LS.get('fb_meal', {});        // 급식 캐시 {학교코드:{ymd:[...]}}
let SC = LS.get('fb_sched', {});      // 학사일정 캐시 {학교코드:[...]}
const saveS = () => LS.set('fb_set', S);
const saveD = () => LS.set('fb_data', D);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
const parseYmd = s => new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
function members(){
  return [{id:'dad', name:S.dad, color:COLORS.dad}, {id:'mom', name:S.mom, color:COLORS.mom},
    ...S.kids.map(k => ({id:k.id, name:k.name, color:k.color})), {id:'all', name:'가족', color:COLORS.all}];
}
const mem = id => members().find(m => m.id === id) || {name:'?', color:'#aaa'};
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('on'), 2000); }

/* ===== 선물 링크(#g=...)로 이름 받기 — 공개 코드엔 가족 이름이 없어요 ===== */
(function readGift(){
  const m = location.hash.match(/g=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try {
    const b = m[1].replace(/-/g,'+').replace(/_/g,'/');
    const g = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
    if (!LS.get('fb_gift_done', 0)){
      if (g.t) S.title = g.t;
      if (g.m) S.msg = g.m;
      if (Array.isArray(g.k)) g.k.slice(0,2).forEach((n, i) => { if (n) S.kids[i].name = n; });
      if (g.d) S.dad = g.d; if (g.u) S.mom = g.u;
      saveS(); LS.set('fb_gift_done', 1); LS.set('fb_hello', 0);
    }
  } catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ===== 날씨 ===== */
function wmo(code, day){
  if (code === 0) return [day ? '☀️' : '🌙', '맑음'];
  if (code <= 2) return [day ? '🌤️' : '☁️', '구름 조금'];
  if (code === 3) return ['☁️', '흐림'];
  if (code === 45 || code === 48) return ['🌫️', '안개'];
  if (code >= 51 && code <= 57) return ['🌦️', '이슬비'];
  if (code >= 61 && code <= 67) return ['🌧️', '비'];
  if (code >= 71 && code <= 77) return ['🌨️', '눈'];
  if (code >= 80 && code <= 82) return ['🌦️', '소나기'];
  if (code >= 85 && code <= 86) return ['☃️', '눈'];
  if (code >= 95) return ['⛈️', '뇌우'];
  return ['🌤️', ''];
}
function wwo2wmo(c){ c = +c; if (c === 113) return 0; if (c === 116) return 2; if (c === 119 || c === 122) return 3; if ([143,248,260].includes(c)) return 45;
  if ([200,386,389,392,395].includes(c)) return 95; if ([179,182,185,227,230,317,320,323,326,329,332,335,338,350,362,365,368,371,374,377].includes(c)) return 71;
  if ([353,356,359].includes(c)) return 80; return 61; }
async function getJSON(url, ms){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 12000);
  try { const r = await fetch(url, {signal:ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadWeather(){

function pmGrade(pm10, pm25){
  const g10 = pm10 == null ? 0 : pm10 <= 30 ? 1 : pm10 <= 80 ? 2 : pm10 <= 150 ? 3 : 4;

function toggleRoutine(k, j, ev){
  const tk = todayKey(); D.checks[tk] = D.checks[tk] || {}; const a = D.checks[tk][k.id] = D.checks[tk][k.id] || [];
  const at = a.indexOf(j); if (at >= 0) a.splice(at, 1); else a.push(j);
  // 오래된 체크 기록 정리
  Object.keys(D.checks).forEach(x => { if (x < ymd(addDays(new Date(), -14))) delete D.checks[x]; });
  if (a.length >= k.routine.length){
    D.bonus[tk] = D.bonus[tk] || {};
    if (!D.bonus[tk][k.id]){ D.bonus[tk][k.id] = 1; D.stars[k.id] = (D.stars[k.id] || 0) + 1; burst(ev, ['⭐','🎉','✨','💛']); toast(k.name + ' 오늘 할 일 끝! 별 하나 받았어요 ⭐'); }
  } else if (at < 0) burst(ev, ['✨']);
  saveD(); renderKids();
}
function addStar(k, n){ D.stars[k.id] = Math.max(0, (D.stars[k.id] || 0) + n); saveD(); renderKids(); toast(n > 0 ? k.name + ' 칭찬 별 ⭐+1' : k.name + ' 별 하나 뺐어요'); }
function claim(k){ D.stars[k.id] = Math.max(0, (D.stars[k.id] || 0) - (+k.goal || 20)); saveD(); renderKids(); burst(null, ['🎁','🎉','⭐','🥳','🎈']); toast('🎉 ' + k.name + ' 보상: ' + k.reward); }
function burst(ev, set){
  const x = ev && ev.clientX ? ev.clientX : innerWidth/2, y = ev && ev.clientY ? ev.clientY : innerHeight/2;
  const n = set.length > 1 ? 16 : 5;
  for (let i = 0; i < n; i++){
    const s = document.createElement('div'); s.className = 'boom'; s.textContent = set[i % set.length];
    s.style.left = x - 17 + 'px'; s.style.top = y - 17 + 'px';
    s.style.setProperty('--dx', (Math.random()*2-1)*180 + 'px'); s.style.setProperty('--dy', (Math.random()*-1.2-0.2)*160 + 'px'); s.style.setProperty('--rt', (Math.random()*2-1)*90 + 'deg');

  }
}

    const ex = out.find(o => o.name === e.n && o.d === e.d); if (ex){ ex.who = '두 아이'; return; }
    out.push({d:e.d, diff, name:e.n, who:k.name});

  S.ddays.forEach(x => { const d = new Date(x.date + 'T00:00'); const diff = dayDiff(today, d); if (diff >= 0) out.push({d:ymd(d), diff, name:x.name, who:'', mine:1}); });
  // 방학식·개학식 같은 큰 일정이 먼저 보이게 같은 날은 하나만

    box.querySelectorAll('#pWho button').forEach(b => b.onclick = () => { e.who = b.dataset.v; box.querySelectorAll('#pWho button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.style.background = on ? mem(x.dataset.v).color : ''; }); });
    box.querySelectorAll('#pMode button').forEach(b => b.onclick = () => { mode = b.dataset.v; box.querySelectorAll('#pMode button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.style.background = on ? 'var(--accent)' : ''; }); $('wRep').style.display = mode === 'rep' ? '' : 'none'; $('wOne').style.display = mode === 'one' ? '' : 'none'; });
    box.querySelectorAll('#pDays button').forEach(b => b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.style.background = on ? 'var(--accent)' : ''; });
    $('bCancel').onclick = closeBox;
    if (ev) $('bDel').onclick = () => { D.events = D.events.filter(x => x.id !== ev.id); saveD(); closeBox(); renderSched(); toast('일정을 지웠어요'); };
    $('bOk').onclick = () => {
      const title = $('iTitle').value.trim(); if (!title){ $('iTitle').focus(); return; }
      const out = {id:ev ? ev.id : uid(), who:e.who, title, time:$('iTime').value};
      if (mode === 'rep'){ out.days = [...box.querySelectorAll('#pDays button.on')].map(b => +b.dataset.v); if (!out.days.length){ toast('요일을 골라 주세요'); return; } }
      else out.date = $('iDate').value;
      D.events = D.events.filter(x => x.id !== out.id).concat(out); saveD(); closeBox(); renderSched(); renderHeader(); toast('저장했어요');
    };
  });
}
const MEMO_COLORS = ['#fff3a8','#ffd6e0','#cdeffd','#d8f5c8','#ffe0b8'];

    <div class="btns">${m ? '<button class="del" id="bDel">떼기</button>' : ''}<button id="bCancel">닫기</button><button class="pri" id="bOk">붙이기</button></div>`, box => {
    box.querySelectorAll('#pCol button').forEach(b => b.onclick = () => { x.color = b.dataset.v; box.querySelectorAll('#pCol button').forEach(y => y.style.outline = y === b ? '3px solid var(--accent)' : ''); });

function editSupplies(k){

function withPin(fn){
  let v = '';
  openBox(`<h2 class="center">어른 확인 🔒</h2><div class="center hint" style="margin-top:-6px">칭찬 별은 엄마·아빠만 줄 수 있어요</div><div class="pin" id="pDots">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'취소',0,'⌫'].map(n => `<button data-v="${n}">${n}</button>`).join('')}</div>`, box => {
    box.querySelectorAll('.pad button').forEach(b => b.onclick = () => {
      const n = b.dataset.v;
      if (n === '취소'){ closeBox(); return; }
      if (n === '⌫') v = v.slice(0, -1); else if (v.length < 4) v += n;
      box.querySelectorAll('#pDots i').forEach((d, i) => d.classList.toggle('f', i < v.length));
      if (v.length === 4){
        if (v === String(S.pin)){ closeBox(); fn(); }
        else { toast('번호가 달라요'); v = ''; setTimeout(() => box.querySelectorAll('#pDots i').forEach(d => d.classList.remove('f')), 200); }
      }
    });
  });
}

/* ===== 설정 ===== */
function openSettings(){
  const T = clone(S);
  const kidHTML = (k, i) => `<div class="kidset" data-i="${i}">
    <h3>${i + 1}. 아이</h3>
    <div class="row2"><div><label>이름</label><input type="text" class="kName" value="${esc(k.name)}"></div>
      <div><label>학년 · 반</label><div class="row2"><select class="kGrade"><option value="">학년</option>${[1,2,3,4,5,6].map(g => `<option ${+k.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select><input type="text" class="kCls" placeholder="반" value="${esc(k.cls)}"></div></div></div>
    <label>캐릭터 · 색</label><div class="pills kEmo">${KID_EMOJI.map(e => `<button data-v="${e}" class="${e === k.emoji ? 'on' : ''}" style="${e === k.emoji ? 'background:' + k.color : ''}">${e}</button>`).join('')}</div>
    <div class="pills kCol" style="margin-top:6px">${KID_COLORS.map(c => `<button data-v="${c}" style="background:${c};width:38px;height:30px;${c === k.color ? 'outline:3px solid var(--ink)' : ''}"></button>`).join('')}</div>
    <label>학교 (급식·학교 일정)</label><div class="row2"><input type="text" class="kSchQ" placeholder="학교 이름 예: 청라초" value=""><button class="kSchB" style="flex:none;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 14px;font-weight:800">찾기</button></div>
    <div class="hint kSchNow">${k.school ? '선택됨: <b>' + esc(k.school.name) + '</b> (' + esc(k.school.region || '') + ')' : '아직 안 골랐어요'}${i === 1 ? ' · <a href="#" class="kSame">첫째와 같은 학교</a>' : ''}</div>
    <div class="res kSchR"></div>
    <label>오늘 할 일 (한 줄에 하나)</label><textarea class="kRt">${esc(k.routine.join('\n'))}</textarea>
    <div class="row2"><div><label>칭찬 별 목표</label><input type="number" class="kGoal" min="1" max="200" value="${esc(k.goal)}"></div><div><label>모으면 받는 보상</label><input type="text" class="kRw" value="${esc(k.reward)}"></div></div>
  </div>`;
  openBox(`<h2>⚙ 설정</h2>
    <label>우리집 이름</label><input type="text" id="sTitle" value="${esc(T.title)}">
    <div class="row2"><div><label>아빠 호칭</label><input type="text" id="sDad" value="${esc(T.dad)}"></div><div><label>엄마 호칭</label><input type="text" id="sMom" value="${esc(T.mom)}"></div></div>
    ${T.kids.map(kidHTML).join('')}
    <h3>날씨 지역</h3>
    <div class="row2"><select id="sCity">${CITIES.map(c => `<option ${c[0] === T.place.name ? 'selected' : ''}>${c[0]}</option>`).join('')}${CITIES.find(c => c[0] === T.place.name) ? '' : `<option selected>${esc(T.place.name)}</option>`}</select>
      <button id="sGeo" style="flex:none;border:none;background:var(--soft);border-radius:12px;padding:0 12px;font-weight:700">📍 지금 위치</button></div>
    <h3>D-day (생일·여행 등)</h3><div id="sDd">${T.ddays.map((d, i) => `<div class="row2" style="margin-top:6px"><input type="text" value="${esc(d.name)}" data-i="${i}" class="ddN"><input type="date" value="${esc(d.date)}" data-i="${i}" class="ddD"><button data-i="${i}" class="ddX" style="flex:none;border:none;background:#ffe3e0;color:#d63a2f;border-radius:12px;padding:0 12px">✕</button></div>`).join('')}</div>
    <button id="sDdAdd" style="margin-top:8px;border:1px dashed var(--line);background:none;border-radius:12px;padding:8px 12px;width:100%">＋ D-day 추가</button>
    <h3>어른 비밀번호 (칭찬 별 줄 때)</h3><input type="text" id="sPin" inputmode="numeric" maxlength="4" value="${esc(T.pin)}">
    <div class="hint">처음 번호는 0000이에요. 아이들이 모르는 4자리로 바꿔 두세요.</div>
    <h3>화면</h3>
    <label><input type="checkbox" id="sNight" ${T.night ? 'checked' : ''}> 밤(21:30~06:30)엔 어두운 화면</label>
    <label><input type="checkbox" id="sWake" ${T.wake ? 'checked' : ''}> 화면 꺼짐 방지 (충전기 꽂아 두고 쓸 때)</label>
    <h3>다른 기기로 옮기기</h3>
    <div class="row2"><button id="sExp" style="border:none;background:var(--soft);border-radius:12px;padding:10px">📋 백업 코드 복사</button><button id="sImp" style="border:none;background:var(--soft);border-radius:12px;padding:10px">📥 백업 코드 붙여넣기</button></div>
    <div class="hint">일정·별·메모는 이 기기에만 저장돼요. 다른 기기에서도 같게 쓰려면 백업 코드로 옮겨요.<br>급식·학교 일정: 나이스 교육정보 개방포털 · 날씨: Open-Meteo</div>
    <div class="btns"><button id="bCancel">닫기</button><button class="pri" id="bOk">저장</button></div>`, box => {
    // 아이별
    box.querySelectorAll('.kidset').forEach(el => {
      const i = +el.dataset.i; const k = T.kids[i];
      el.querySelectorAll('.kEmo button').forEach(b => b.onclick = () => { k.emoji = b.dataset.v; el.querySelectorAll('.kEmo button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.style.background = on ? k.color : ''; }); });
      el.querySelectorAll('.kCol button').forEach(b => b.onclick = () => { k.color = b.dataset.v; el.querySelectorAll('.kCol button').forEach(x => x.style.outline = x === b ? '3px solid var(--ink)' : ''); const on = el.querySelector('.kEmo button.on'); if (on) on.style.background = k.color; });
      const showSch = () => { el.querySelector('.kSchNow').innerHTML = (k.school ? '선택됨: <b>' + esc(k.school.name) + '</b> (' + esc(k.school.region || '') + ')' : '아직 안 골랐어요') + (i === 1 ? ' · <a href="#" class="kSame">첫째와 같은 학교</a>' : ''); bindSame(); };
      const bindSame = () => { const a = el.querySelector('.kSame'); if (a) a.onclick = ev => { ev.preventDefault(); if (T.kids[0].school){ k.school = clone(T.kids[0].school); showSch(); } else toast('첫째 학교부터 골라 주세요'); }; };
      bindSame();
      const search = async () => {
        const q = el.querySelector('.kSchQ').value.trim(); if (!q) return;
        const R = el.querySelector('.kSchR'); R.innerHTML = '<div class="hint">찾는 중…</div>';
        try {
          const r = await getJSON(`${NEIS}schoolInfo?Type=json&pSize=20&SCHUL_NM=${encodeURIComponent(q)}`);
          const rows = r.schoolInfo ? r.schoolInfo[1].row : [];
          if (!rows.length){ R.innerHTML = '<div class="hint">못 찾았어요. 이름을 줄여서 다시 (예: 청라)</div>'; return; }
          R.innerHTML = rows.map((x, j) => `<button data-j="${j}">${esc(x.SCHUL_NM)} <small>${esc(x.ORG_RDNMA || x.LCTN_SC_NM)}</small></button>`).join('');
          R.querySelectorAll('button').forEach(b => b.onclick = () => {
            const x = rows[+b.dataset.j];
            k.school = {office:x.ATPT_OFCDC_SC_CODE, code:x.SD_SCHUL_CODE, name:x.SCHUL_NM, region:(x.ORG_RDNMA || '').split(' ').slice(0, 2).join(' '), addr:x.ORG_RDNMA || ''};
            R.innerHTML = ''; showSch();
            // 날씨 지역 자동 맞추기
            if (T.place.auto){ const c = CITIES.slice().sort((a, b) => b[0].length - a[0].length).find(c => { const parts = c[0].split(' '); return parts.every(p => (x.ORG_RDNMA || '').includes(p)); }); if (c){ $('sCity').value = c[0]; } }
          });
        } catch(e){ R.innerHTML = '<div class="hint">인터넷 연결을 확인해 주세요</div>'; }
      };
      el.querySelector('.kSchB').onclick = search;
      el.querySelector('.kSchQ').onkeydown = e => { if (e.key === 'Enter') search(); };
    });
    // D-day
    const redrawDd = () => { $('sDd').innerHTML = T.ddays.map((d, i) => `<div class="row2" style="margin-top:6px"><input type="text" value="${esc(d.name)}" placeholder="예: 엄마 생일" data-i="${i}" class="ddN"><input type="date" value="${esc(d.date)}" data-i="${i}" class="ddD"><button data-i="${i}" class="ddX" style="flex:none;border:none;background:#ffe3e0;color:#d63a2f;border-radius:12px;padding:0 12px">✕</button></div>`).join(''); bindDd(); };
    const bindDd = () => {
      box.querySelectorAll('.ddN').forEach(x => x.oninput = () => T.ddays[+x.dataset.i].name = x.value);
      box.querySelectorAll('.ddD').forEach(x => x.oninput = () => T.ddays[+x.dataset.i].date = x.value);
      box.querySelectorAll('.ddX').forEach(x => x.onclick = () => { T.ddays.splice(+x.dataset.i, 1); redrawDd(); });
    };
    bindDd();
    $('sDdAdd').onclick = () => { T.ddays.push({name:'', date:dstr(addDays(new Date(), 7))}); redrawDd(); };
    $('sCity').onchange = () => { T.place.auto = 0; };
    $('sGeo').onclick = () => {
      if (!navigator.geolocation){ toast('이 기기는 위치를 못 써요'); return; }
      navigator.geolocation.getCurrentPosition(p => { T.place = {name:'우리 동네', lat:+p.coords.latitude.toFixed(3), lon:+p.coords.longitude.toFixed(3), auto:0, geo:1};
        const o = document.createElement('option'); o.textContent = '우리 동네'; o.selected = true; $('sCity').appendChild(o); toast('지금 위치로 맞췄어요'); }, () => toast('위치 권한을 허용해 주세요'), {timeout:10000});
    };
    $('sExp').onclick = async () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify({S, D})))); try { await navigator.clipboard.writeText(code); toast('복사했어요. 다른 기기에서 붙여넣기 하세요'); } catch(e){ openBox(`<h2>백업 코드</h2><textarea style="min-height:180px">${code}</textarea><div class="btns"><button onclick="closeBox()">닫기</button></div>`); } };
    $('sImp').onclick = () => openBox(`<h2>백업 코드 붙여넣기</h2><textarea id="iImp" placeholder="여기에 붙여넣기"></textarea><div class="btns"><button id="bC2">닫기</button><button class="pri" id="bI2">불러오기</button></div>`, () => {
      $('bC2').onclick = closeBox;
      $('bI2').onclick = () => { try { const o = JSON.parse(decodeURIComponent(escape(atob($('iImp').value.trim())))); if (!o.S || !o.D) throw 0; S = Object.assign(clone(DEF_SET), o.S); D = Object.assign(clone(DEF_DATA), o.D); saveS(); saveD(); closeBox(); refreshAll(true); toast('불러왔어요'); } catch(e){ toast('코드가 올바르지 않아요'); } };
    });
    $('bCancel').onclick = closeBox;
    $('bOk').onclick = () => {
      T.title = $('sTitle').value.trim() || '우리집'; T.dad = $('sDad').value.trim() || '아빠'; T.mom = $('sMom').value.trim() || '엄마';
      box.querySelectorAll('.kidset').forEach(el => {
        const k = T.kids[+el.dataset.i];
        k.name = el.querySelector('.kName').value.trim() || k.name; k.grade = el.querySelector('.kGrade').value; k.cls = el.querySelector('.kCls').value.trim();
        k.routine = el.querySelector('.kRt').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 8); if (!k.routine.length) k.routine = DEF_ROUTINE.slice();
        k.goal = Math.max(1, Math.min(200, +el.querySelector('.kGoal').value || 20)); k.reward = el.querySelector('.kRw').value.trim() || '원하는 놀이 하기 🎠';
      });
      const cn = $('sCity').value; const c = CITIES.find(x => x[0] === cn);
      if (c && !(T.place.geo && cn === '우리 동네')) T.place = {name:c[0], lat:c[1], lon:c[2], auto:T.place.auto};
      const pin = $('sPin').value.trim(); if (/^\d{4}$/.test(pin)) T.pin = pin; else { toast('비밀번호는 숫자 4자리로'); return; }
      T.night = $('sNight').checked ? 1 : 0; T.wake = $('sWake').checked ? 1 : 0;
      T.ddays = T.ddays.filter(d => d.name && d.date);
      const schoolChanged = JSON.stringify(T.kids.map(k => k.school)) !== JSON.stringify(S.kids.map(k => k.school));
      const placeChanged = T.place.lat !== S.place.lat || T.place.lon !== S.place.lon;
      S = T; saveS(); closeBox(); refreshAll(false);
      if (placeChanged) loadWeather(); if (schoolChanged) loadSchool();
      toast('저장했어요');
    };
  });
}

/* ===== 시작 화면 ===== */
function hello(){
  const kids = S.kids.map(k => k.name).join('·');
  openBox(`<div class="big">🎁</div><h2 class="center">${esc(S.title)} 보드 도착!</h2>
    <p class="center" style="line-height:1.7">${S.msg ? esc(S.msg) + '<br>' : ''}${esc(kids)}의 할 일·칭찬 별, 가족 일정,<br>급식과 날씨를 한 화면에 모았어요.</p>
    <div class="hint center">⚙ 설정에서 <b>학교</b>와 <b>동네</b>만 고르면 바로 써요.<br>거실 태블릿이나 남는 폰을 가로로 세워 두면 딱 좋아요.<br>브라우저 메뉴의 <b>홈 화면에 추가</b>로 앱처럼 쓸 수 있어요.</div>
    <div class="btns"><button id="bLater">둘러보기</button><button class="pri" id="bSetup">학교·동네 고르기</button></div>`, () => {
    $('bLater').onclick = () => { LS.set('fb_hello', 1); closeBox(); keepAwake(); };
    $('bSetup').onclick = () => { LS.set('fb_hello', 1); keepAwake(); openSettings(); };
  });
}

/* ===== 화면 유지·밤 모드·갱신 ===== */
let wake = null;
async function keepAwake(){ if (!S.wake || !('wakeLock' in navigator) || document.hidden || wake) return; try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (!document.hidden){ keepAwake(); tick(true); } });
document.addEventListener('click', () => keepAwake(), {passive:true});
$('tFull').onclick = () => { const d = document, el = d.documentElement; try { if (d.fullscreenElement) d.exitFullscreen(); else { const f = el.requestFullscreen || el.webkitRequestFullscreen; const r = f && f.call(el); if (r && r.catch) r.catch(() => {}); } } catch(e){} };
$('tSet').onclick = openSettings;
$('addEv').onclick = () => editEvent(null);
$('addMemo').onclick = () => editMemo(null);
function applyNight(){ const h = new Date().getHours() * 60 + new Date().getMinutes(); document.body.classList.toggle('night', !!S.night && (h >= 21*60+30 || h < 6*60+30)); }
function refreshAll(){ applyNight(); renderHeader(); renderSched(); renderKids(); renderRight(); }
let lastDay = ymd(new Date()), lastMin = -1;
function tick(force){
  const now = new Date();
  if (now.getMinutes() !== lastMin || force){
    lastMin = now.getMinutes(); applyNight(); renderHeader();
    if (now.getMinutes() % 5 === 0 || force) { renderSched(); renderRight(); }
  }
  if (ymd(now) !== lastDay){ lastDay = ymd(now); refreshAll(); loadSchool(); }
  if (!W || Date.now() - W.at > 30*60000 || W.place !== S.place.name) { if (!tick.wl || Date.now() - tick.wl > 60000){ tick.wl = Date.now(); loadWeather(); } }
  const sc = schools(); if (sc.some(s => !M[s.code] || Date.now() - M[s.code].at > 3*3600000)) { if (!tick.sl || Date.now() - tick.sl > 120000){ tick.sl = Date.now(); loadSchool(); } }
}
refreshAll();
tick(true);
setInterval(tick, 10000);
if (!LS.get('fb_hello', 0)) hello();
</script>
