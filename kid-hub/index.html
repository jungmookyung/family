<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>우리 집 Kid Hub</title>
<meta name="description" content="우리 집 아이들 할 일·일정·경험 기록" />
<meta name="theme-color" content="#0a0b0e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Kid Hub" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-mark" src="./icons/icon-192.png" alt="" width="30" height="30" />
    <span class="brand-name">KID HUB</span>
  </div>
  <nav class="top-actions" aria-label="상단 메뉴">
    <button type="button" data-open="people">사람</button>
    <button type="button" data-open="places">장소</button>
    <button type="button" id="btn-sync" class="sync-btn" aria-label="동기화">SYNC<span class="dot" aria-hidden="true"></span></button>
    <button type="button" data-open="settings">설정</button>
  </nav>
</header>

<div class="statusbar" aria-live="polite">
  <span class="chip chip-owner">무경 · owner</span>
  <span class="chip" id="status-local">로컬 저장</span>
  <span class="chip" id="status-gh">GitHub 미연결</span>
  <span class="chip" id="status-synced">동기화 기록 없음</span>
</div>

<main>
  <section class="view" id="view-todos">
    <div class="filters">
      <div class="filter-row" id="child-filters" role="group" aria-label="아이별 필터">
        <button type="button" class="chip-filter active" data-child="전체">전체</button>
        <button type="button" class="chip-filter" data-child="지우">지우</button>
        <button type="button" class="chip-filter" data-child="지민">지민</button>
        <button type="button" class="chip-filter hide-toggle" id="hide-done" aria-pressed="true">
          <span class="switch" aria-hidden="true"></span>완료 숨기기
        </button>
      </div>
      <div class="filter-row" id="tag-filters" role="group" aria-label="태그별 필터"></div>
    </div>
    <div class="list" id="todo-list"></div>
    <section class="events-block" aria-labelledby="events-title">
      <h2 class="section-title" id="events-title">EVENTS <span class="count" id="event-count">· 0</span></h2>
      <div id="event-list"></div>
    </section>
  </section>

  <section class="view" id="view-exp" hidden>
    <div class="filter-row" id="exp-filters" style="padding:12px 14px 6px" role="group" aria-label="아이별 필터">
      <button type="button" class="chip-filter active" data-exp-child="전체">전체</button>
      <button type="button" class="chip-filter" data-exp-child="지우">지우</button>
      <button type="button" class="chip-filter" data-exp-child="지민">지민</button>
    </div>
    <div class="list" id="exp-list"></div>
  </section>
</main>

<button type="button" class="fab" id="fab" aria-label="새 항목 추가">+</button>

<nav class="tabbar" role="tablist" aria-label="화면 전환">
  <button type="button" class="tab active" data-tab="todos" role="tab" aria-selected="true">
    To-dos <span class="tab-count" id="count-todos">0</span>
  </button>
  <button type="button" class="tab" data-tab="exp" role="tab" aria-selected="false">
    Experiences <span class="tab-count" id="count-exp">0</span>
  </button>
</nav>

<div class="modal-root" id="modal-root" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<div class="toast-root" id="toast-root" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
